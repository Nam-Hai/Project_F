; Teensy 4.1 build (PlatformIO). The desktop build (emulator, tests, bench) stays on CMake.
; Build:  pio run          Upload:  pio run -t upload

; The project root is the source root so that platform/teensy/ and core/ build side by side.
[platformio]
src_dir = .

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; core/profile/profile_codec.cpp is left out: it is the JSON codec (PC only, see plan_teensy.md T7).
build_src_filter = -<*> +<platform/teensy/*.cpp> +<core/*.cpp> +<core/ui/*.cpp> +<core/profile/binary_codec.cpp> +<core/profile/profile_status.cpp>

build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -O2
    -Wall
    -Wextra
    -Wdouble-promotion
    -I.
